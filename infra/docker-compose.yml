services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ashare_user
      POSTGRES_PASSWORD: ashare_password
      POSTGRES_DB: ashare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashare_user -d ashare_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ashare_user:ashare_password@db:5432/ashare_db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Same-origin base path for API calls from the browser. The web
        # container's nginx proxies /api/* to the api service, so the app
        # works without CORS (apps/api must stay unmodified).
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
